<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vishal Consulting</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: #ffffff;

    background:
        radial-gradient(
            circle at 50% 0%,
            #123d78 0%,
            #081a36 35%,
            #020812 75%,
            #01050b 100%
        );

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.container {
    width: 100%;
    max-width: 430px;
    text-align: center;
}

/* =========================
   LOGO
========================= */

.logo-box {
    width: 150px;
    height: 150px;

    margin: 0 auto 8px;

    display: flex;
    justify-content: center;
    align-items: center;
}

.logo-box iframe {
    width: 150px;
    height: 150px;

    border: none;
    background: transparent;

    display: block;
}

/* =========================
   BRAND NAME
========================= */

.brand {
    font-size: 30px;
    font-weight: 800;

    letter-spacing: 1px;

    margin-bottom: 6px;

    color: #ffffff;
}

.subtitle {
    font-size: 12px;
    font-weight: 700;

    letter-spacing: 4px;

    color: #21baff;

    margin-bottom: 25px;
}

/* =========================
   CARD
========================= */

.card {
    width: 100%;

    padding: 28px 22px;

    border-radius: 24px;

    background: rgba(255, 255, 255, 0.075);

    border: 1px solid rgba(255, 255, 255, 0.15);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255,255,255,0.08);
}

/* =========================
   TITLE
========================= */

.title {
    font-size: 25px;
    font-weight: 800;

    margin-bottom: 8px;
}

.description {
    color: #b9c8dc;

    font-size: 14px;

    line-height: 1.6;

    margin-bottom: 24px;
}

/* =========================
   INPUT
========================= */

.input {
    width: 100%;

    padding: 15px 16px;

    margin-bottom: 14px;

    border-radius: 12px;

    border: 1px solid rgba(255,255,255,0.17);

    outline: none;

    background: rgba(0,0,0,0.28);

    color: #ffffff;

    font-size: 15px;

    transition: 0.2s;
}

.input:focus {
    border-color: #16bfff;

    box-shadow:
        0 0 0 2px rgba(0,190,255,0.12);
}

.input::placeholder {
    color: #8f9db1;
}

/* =========================
   BUTTON
========================= */

button {
    width: 100%;

    padding: 16px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            90deg,
            #006cff,
            #00c6ff
        );

    color: #ffffff;

    font-size: 15px;

    font-weight: 800;

    letter-spacing: 0.5px;

    cursor: pointer;

    box-shadow:
        0 10px 30px rgba(0,145,255,0.32);

    transition: 0.2s;
}

button:hover {
    transform: translateY(-1px);

    box-shadow:
        0 14px 35px rgba(0,170,255,0.42);
}

button:active {
    transform: scale(0.98);
}

button:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

/* =========================
   SUCCESS MESSAGE
========================= */

.success {
    display: none;

    padding: 20px 5px;
}

.success h2 {
    color: #25d6ff;

    font-size: 23px;

    margin-bottom: 10px;
}

.success p {
    color: #c5d1e2;

    font-size: 14px;

    line-height: 1.6;
}

/* =========================
   FOOTER
========================= */

.footer {
    margin-top: 18px;

    color: #718198;

    font-size: 11px;

    line-height: 1.5;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

    body {
        padding: 15px;
    }

    .logo-box {
        width: 135px;
        height: 135px;
    }

    .logo-box iframe {
        width: 135px;
        height: 135px;
    }

    .brand {
        font-size: 27px;
    }

    .card {
        padding: 25px 18px;
    }
}
</style>

</head>

<body>

<div class="container">

    <!-- =========================
         LOGO
    ========================== -->

    <div class="logo-box">

        <iframe
            src="logo.html"
            title="Vishal Consulting Logo"
            scrolling="no">
        </iframe>

    </div>


    <!-- =========================
         BRAND
    ========================== -->

    <div class="brand">
        Vishal Consulting
    </div>

    <div class="subtitle">
        ANGEL ONE NXT
    </div>


    <!-- =========================
         MAIN CARD
    ========================== -->

    <div class="card">

        <div id="formSection">

            <div class="title">
                Get Started
            </div>

            <div class="description">
                Enter your details to receive more information.
            </div>


            <!-- LEAD FORM -->

            <form id="leadForm">

                <input
                    class="input"
                    type="text"
                    name="name"
                    placeholder="Enter Your Name"
                    autocomplete="name"
                    required
                >


                <input
                    class="input"
                    type="tel"
                    name="phone"
                    placeholder="Enter Mobile Number"
                    inputmode="numeric"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    autocomplete="tel"
                    required
                >


                <button
                    type="submit"
                    id="submitButton">
                    UNLOCK BENEFITS →
                </button>

            </form>

        </div>


        <!-- =========================
             SUCCESS
        ========================== -->

        <div
            class="success"
            id="successMessage">

            <h2>
                Details Submitted ✓
            </h2>

            <p>
                Thank you. Your details have been submitted successfully.
            </p>

        </div>

    </div>


    <!-- =========================
         FOOTER
    ========================== -->

    <div class="footer">
        © 2026 Vishal Consulting. All rights reserved.
    </div>

</div>


<script>

/* =========================
   GOOGLE SHEETS WEB APP URL
========================= */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwwT4XBymDqz52PTYF0mHHjBxLrV25c4RI1cabITouvI_5ZGA5dy6SYTtmojFKpGqnI/exec";


/* =========================
   FORM SUBMISSION
========================= */

document
.getElementById("leadForm")
.addEventListener("submit", function(e) {

    e.preventDefault();


    const form = this;

    const button =
        document.getElementById("submitButton");


    /* Button loading */

    button.disabled = true;

    button.innerText =
        "SUBMITTING...";


    /* Create data */

    const data =
        new URLSearchParams();


    data.append(
        "name",
        form.name.value.trim()
    );


    data.append(
        "phone",
        form.phone.value.trim()
    );


    /* Send to Google Sheets */

    fetch(
        SCRIPT_URL,
        {
            method: "POST",

            mode: "no-cors",

            headers: {
                "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
                data.toString()
        }
    )

    .then(function() {

        /* Hide form */

        document
        .getElementById("formSection")
        .style.display = "none";


        /* Show success */

        document
        .getElementById("successMessage")
        .style.display = "block";

    })

    .catch(function(error) {

        console.error(error);


        button.disabled = false;

        button.innerText =
            "UNLOCK BENEFITS →";


        alert(
            "Something went wrong. Please try again."
        );

    });

});

</script>

</body>
</html>
